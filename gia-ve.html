<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Giá vé - Beta Cinemas</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .gia-ve-container {
            max-width: 1500px;
            margin: 40px auto 80px auto;
            padding: 0 20px;
            text-align: center;
        }

        .gia-ve-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 32px;
            font-weight: 800;
            color: var(--text-navy);
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .gia-ve-img {
            width: 100%;
            max-width: 1100px;
            /* BẠN CÓ THỂ CHỈNH THÔNG SỐ NÀY ĐỂ TO NHỎ */
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <div class="gia-ve-container">
        <h1 class="gia-ve-title">BẢNG GIÁ VÉ</h1>
        <img src="https://files.betacorp.vn/cms/images/2024/04/03/bang-gia-ve-tx-ve-2d-va-3d-1920x2400-150646-030424-93.png"
            alt="Bảng giá vé Beta Cinemas" class="gia-ve-img" referrerpolicy="no-referrer">
    </div>

    <!-- Script dependencies -->
    <script src="js/data.js"></script>
    <script src="js/layout.js"></script>
</body>

</html>
