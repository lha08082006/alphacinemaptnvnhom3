<!DOCTYPE html>
<html lang="vi">
<head>
    
    <meta charset="UTF-8">
    <title>Kết quả giao dịch - Beta Cinemas DEMO</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .result-box { max-width: 600px; margin: 80px auto; text-align: center; padding: 40px; background: white; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .spinner { width: 50px; height: 50px; border: 4px solid #f3f3f3; border-top: 4px solid var(--beta-blue); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .icon-large { font-size: 60px; margin-bottom: 20px; }
        .icon-success { color: #4CAF50; }
        .icon-error { color: var(--danger); }
        .icon-warning { color: var(--warning); }
    </style>
</head>
<body>
    <!-- Layout chèn Header tự động -->
    <div class="container-fluid" id="result-container">
        <div class="result-box" id="result-content">
            <div class="spinner"></div>
            <h2 style="color: var(--beta-blue);">Đang chờ kết quả từ cổng thanh toán...</h2>
            <p style="color: #666; margin-top: 15px;">Vui lòng không tắt trình duyệt (Thời gian chờ tối đa 10 phút)</p>
        </div>
    </div>

    <script src="js/clock.js"></script>
    <script src="js/data.js"></script>
    <script src="js/db.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/demo-panel.js"></script>
    <script src="js/notify.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('orderId');
            if(!orderId) { location.href = 'index.html'; return; }
            
            let pollTimer = setInterval(() => {
                const order = DB.get('beta_orders', orderId);
                if(!order) return;
                
                const content = document.getElementById('result-content');
                
                if (order.status === 'PAID') {
                    clearInterval(pollTimer);
                    content.innerHTML = `
                        <div class="icon-large icon-success">✔️</div>
                        <h2 style="color: #4CAF50;">THANH TOÁN THÀNH CÔNG</h2>
                        <p style="margin: 20px 0; font-size: 16px;">Đơn hàng <strong>${orderId}</strong> của bạn đã được thanh toán và xuất vé.</p>
                        <a href="ticket.html?orderId=${orderId}" class="btn btn-primary">XEM VÉ ĐIỆN TỬ</a>
                    `;
                } 
                else if (order.status === 'FAILED') {
                    clearInterval(pollTimer);
                    // Lỗi Giao dịch treo ở chế độ AS-IS sẽ văng ra màn hình này, khiến khách hàng lầm tưởng thanh toán xịt và bấm Thử Lại (gây trừ tiền lần 2)
                    content.innerHTML = `
                        <div class="icon-large icon-error">❌</div>
                        <h2 style="color: var(--danger);">GIAO DỊCH THẤT BẠI</h2>
                        <p style="margin: 20px 0; font-size: 16px; color: #555;">Thanh toán không thành công hoặc quá hạn chờ xác nhận từ ngân hàng.</p>
                        <p style="color: var(--danger); font-weight: bold; margin-bottom: 20px;">Lưu ý (AS-IS): Nếu bạn đã bị trừ tiền, hãy liên hệ hotline Beta.</p>
                        <button class="btn btn-orange" onclick="location.href='index.html'">ĐẶT VÉ LẠI</button>
                    `;
                }
                else if (order.status === 'CANCELLED') {
                    clearInterval(pollTimer);
                    content.innerHTML = `
                        <div class="icon-large" style="color: #999;">🚫</div>
                        <h2 style="color: #666;">ĐÃ HỦY THANH TOÁN</h2>
                        <p style="margin: 20px 0;">Bạn đã hủy giao dịch trên Cổng thanh toán.</p>
                        <button class="btn btn-primary" onclick="location.href='index.html'">VỀ TRANG CHỦ</button>
                    `;
                }
                else if (order.status === 'PENDING_VERIFY') {
                    clearInterval(pollTimer);
                    // Chế độ TO-BE: Hệ thống phát hiện rớt mạng / Timeout, nhưng không cho thất bại ngay mà khóa hiển thị
                    content.innerHTML = `
                        <div class="icon-large icon-warning">⏳</div>
                        <h2 style="color: var(--warning);">ĐANG XỬ LÝ GIAO DỊCH</h2>
                        <p style="margin: 20px 0; font-size: 16px; line-height: 1.6;">Chúng tôi chưa nhận được kết quả cuối cùng từ Ngân hàng.<br>
                        <b style="color: var(--danger);">Vui lòng KHÔNG thực hiện thanh toán lại.</b> Chúng tôi sẽ đối soát và thông báo kết quả cho bạn trong ít phút.</p>
                        <a href="order.html?id=${orderId}" class="btn btn-primary">THEO DÕI ĐƠN HÀNG</a>
                    `;
                }
            }, 1000);
            
            // Xử lý timeout khẩn cấp nếu web lỡ bị treo
            setTimeout(() => {
                const order = DB.get('beta_orders', orderId);
                if (order && order.status === 'AWAITING_PAYMENT') {
                    if(window.betaCore) window.betaCore.handleCallbackTimeout(orderId);
                }
            }, JSON.parse(localStorage.getItem('demoSettings') || '{}').callbackTimeoutSec * 1000 + 2000);
        });
    </script>
</body>
</html>
