<!DOCTYPE html>
<html lang="vi">
<head>
    
    <meta charset="UTF-8">
    <title>Lịch sử giao dịch - Beta Cinemas DEMO</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid" style="margin-top: 30px; min-height: 500px;">
        <h2 style="color: var(--beta-blue); border-left: 4px solid var(--beta-orange); padding-left: 10px; margin-bottom: 20px;">LỊCH SỬ GIAO DỊCH</h2>
        
        <table class="table" style="width: 100%;">
            <thead>
                <tr>
                    <th>Mã Đơn</th>
                    <th>Ngày mua</th>
                    <th>Phim</th>
                    <th>Tổng tiền</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="history-table"></tbody>
        </table>
    </div>

    <script src="js/clock.js"></script>
    <script src="js/data.js"></script>
    <script src="js/db.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/demo-panel.js"></script>
    <script src="js/notify.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
            if(!user) { location.href = 'login.html'; return; }
            
            const orders = DB.all('beta_orders').filter(o => o.userEmail === user.email);
            orders.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
            
            const tbody = document.getElementById('history-table');
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Bạn chưa có giao dịch nào.</td></tr>';
                return;
            }
            
            orders.forEach(o => {
                const m = DB.get('movies', o.movieId);
                const title = m ? m.title : 'N/A';
                
                let st = o.status;
                let bg = '#ccc';
                if(st==='PAID') { bg='#4CAF50'; st='Thành công'; }
                if(st==='FAILED') { bg='#F44336'; st='Thất bại'; }
                if(st==='CANCELLED') { bg='#999'; st='Đã hủy'; }
                if(st==='PENDING_VERIFY') { bg='#FF9800'; st='Đang xử lý'; }
                if(o.refund && o.refund.status === 'REFUNDED') { bg='#E91E63'; st='Đã hoàn tiền'; }

                const badge = `<span style="background:${bg}; color:white; padding:4px 8px; border-radius:4px; font-size:12px;">${st}</span>`;
                const d = new Date(o.createdAt).toLocaleString('vi-VN');
                
                tbody.insertAdjacentHTML('beforeend', `
                    <tr>
                        <td><strong>${o.orderId}</strong></td>
                        <td>${d}</td>
                        <td>${title}</td>
                        <td style="color:var(--beta-orange); font-weight:bold;">${o.amount.toLocaleString('vi-VN')} đ</td>
                        <td>${badge}</td>
                        <td>
                            <a href="order.html?id=${o.orderId}" class="btn btn-outline" style="padding: 5px 10px; font-size: 12px;">Chi tiết</a>
                            ${o.status === 'PAID' ? `<a href="ticket.html?orderId=${o.orderId}" class="btn btn-primary" style="padding: 5px 10px; font-size: 12px; margin-left: 5px;">Xem Vé</a>` : ''}
                        </td>
                    </tr>
                `);
            });
        });
    </script>
</body>
</html>
