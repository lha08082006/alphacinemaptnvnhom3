<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập & Đăng ký Thành viên - Beta Cinemas</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/account.css">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Be Vietnam Pro', 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
        }
        .auth-standalone-wrapper {
            max-width: 520px;
            margin: 50px auto 80px;
            padding: 0 20px;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }
        .auth-card-top {
            background: linear-gradient(135deg, #023e7d 0%, #005198 100%);
            color: #ffffff;
            text-align: center;
            padding: 26px 20px 22px;
        }
        .auth-brand-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1.5px;
            margin: 0;
        }
        .auth-brand-sub {
            font-size: 12px;
            color: #bfdbfe;
            letter-spacing: 1px;
            margin-top: 5px;
        }
        .auth-tab-buttons {
            display: flex;
            border-bottom: 2px solid #f1f5f9;
            background: #ffffff;
        }
        .auth-tab-btn {
            flex: 1;
            padding: 15px;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 14.5px;
            color: #94a3b8;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .auth-tab-btn.active {
            color: #005198;
            border-bottom-color: #005198;
        }
        .auth-card-body {
            padding: 30px 28px;
        }
        .auth-form-field {
            margin-bottom: 18px;
        }
        .auth-form-label {
            display: block;
            font-size: 13.5px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        .auth-input-control {
            width: 100%;
            height: 44px;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .auth-input-control:focus {
            border-color: #005198;
            box-shadow: 0 0 0 3px rgba(0, 81, 152, 0.15);
        }
        .btn-beta-submit {
            width: 100%;
            height: 44px;
            border-radius: 10px;
            background-color: #005198;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 14.5px;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-beta-submit:hover {
            background-color: #3db1f3;
            box-shadow: 0 4px 12px rgba(61, 177, 243, 0.35);
        }
        .btn-beta-facebook {
            width: 100%;
            height: 44px;
            border-radius: 10px;
            background-color: #F595A6;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-beta-facebook:hover {
            background-color: #e67388;
        }
        .captcha-row-box {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 18px;
        }
        .captcha-canvas-wrap {
            display: flex;
            align-items: center;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            overflow: hidden;
            background: #e8f5e9;
        }
        .auth-notice-box {
            margin-top: 25px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            font-size: 13px;
            color: #475569;
            line-height: 1.6;
        }
        .auth-msg-alert {
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13.5px;
            margin-bottom: 18px;
            display: none;
        }
        .auth-msg-alert.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .auth-msg-alert.success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
    </style>
</head>
<body>

    <!-- Header will be injected by layout.js -->

    <div class="auth-standalone-wrapper">
        <div class="auth-card">
            <div class="auth-card-top">
                <h2 class="auth-brand-title">BETA CINEMAS</h2>
                <div class="auth-brand-sub">CỔNG THÀNH VIÊN ĐIỆN ẢNH VIỆT NAM</div>
            </div>

            <div class="auth-tab-buttons">
                <button type="button" id="tab-btn-login" class="auth-tab-btn active" onclick="switchTab('login')">
                    ĐĂNG NHẬP
                </button>
                <button type="button" id="tab-btn-register" class="auth-tab-btn" onclick="switchTab('register')">
                    ĐĂNG KÝ
                </button>
            </div>

            <div class="auth-card-body">
                <!-- Panel 1: Đăng nhập -->
                <div id="panel-login">
                    <div id="login-error-msg" class="auth-msg-alert error"></div>
                    
                    <form id="standalone-login-form">
                        <div class="auth-form-field">
                            <label class="auth-form-label">Email tài khoản *</label>
                            <input type="email" id="login-email" class="auth-input-control" value="khachhang@gmail.com" required placeholder="Nhập địa chỉ email...">
                        </div>

                        <div class="auth-form-field">
                            <label class="auth-form-label">Mật khẩu *</label>
                            <input type="password" id="login-password" class="auth-input-control" value="Password@123" required placeholder="Nhập mật khẩu...">
                        </div>

                        <!-- Captcha Đăng nhập -->
                        <div class="captcha-row-box">
                            <div class="captcha-canvas-wrap">
                                <canvas id="login-captcha-canvas" width="120" height="42" style="cursor: pointer;" title="Nhấp để đổi mã"></canvas>
                                <button type="button" onclick="refreshLoginCaptcha()" style="background: none; border: none; padding: 0 8px; cursor: pointer; color: #2e7d32;" title="Làm mới captcha">🔄</button>
                            </div>
                            <input type="text" id="login-captcha-input" class="auth-input-control" placeholder="Mã xác thực" required maxlength="6" autocomplete="off">
                        </div>

                        <button type="submit" id="btn-login-submit" class="btn-beta-submit">
                            ĐĂNG NHẬP
                        </button>

                        <button type="button" class="btn-beta-facebook" onclick="socialLogin('Facebook')">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                            ĐĂNG NHẬP BẰNG FACEBOOK
                        </button>
                    </form>

                    <div class="auth-notice-box">
                        <strong style="color: #f26b38;">Tài khoản Khách Hàng Thử Nghiệm:</strong><br>
                        • Email: <b>khachhang@gmail.com</b><br>
                        • Mật khẩu: <b>Password@123</b> (Đã có sẵn 100 điểm thưởng)<br>
                        • Email 2: <b>khachhang2@gmail.com</b>
                    </div>
                </div>

                <!-- Panel 2: Đăng ký -->
                <div id="panel-register" style="display: none;">
                    <div id="reg-error-msg" class="auth-msg-alert error"></div>
                    <div id="reg-success-msg" class="auth-msg-alert success"></div>

                    <form id="standalone-register-form">
                        <div class="auth-form-field">
                            <label class="auth-form-label">Họ và tên *</label>
                            <input type="text" id="reg-name" class="auth-input-control" required placeholder="Nguyễn Văn A">
                        </div>

                        <div class="auth-form-field">
                            <label class="auth-form-label">Địa chỉ Email *</label>
                            <input type="email" id="reg-email" class="auth-input-control" required placeholder="email@domain.com">
                        </div>

                        <div class="auth-form-field">
                            <label class="auth-form-label">Số điện thoại *</label>
                            <input type="tel" id="reg-phone" class="auth-input-control" required placeholder="0912 345 678" pattern="[0-9]{10,11}">
                        </div>

                        <div class="auth-form-field">
                            <label class="auth-form-label">Mật khẩu *</label>
                            <input type="password" id="reg-password" class="auth-input-control" required placeholder="Ít nhất 6 ký tự">
                        </div>

                        <div class="auth-form-field">
                            <label class="auth-form-label">Xác nhận mật khẩu *</label>
                            <input type="password" id="reg-confirm-pw" class="auth-input-control" required placeholder="Nhập lại mật khẩu">
                        </div>

                        <!-- Captcha Đăng ký -->
                        <div class="captcha-row-box">
                            <div class="captcha-canvas-wrap">
                                <canvas id="reg-captcha-canvas" width="120" height="42" style="cursor: pointer;" title="Nhấp để đổi mã"></canvas>
                                <button type="button" onclick="refreshRegCaptcha()" style="background: none; border: none; padding: 0 8px; cursor: pointer; color: #2e7d32;" title="Làm mới captcha">🔄</button>
                            </div>
                            <input type="text" id="reg-captcha-input" class="auth-input-control" placeholder="Mã xác thực" required maxlength="6" autocomplete="off">
                        </div>

                        <button type="submit" id="btn-reg-submit" class="btn-beta-submit">
                            ĐĂNG KÝ TÀI KHOẢN
                        </button>

                        <button type="button" class="btn-beta-facebook" onclick="socialLogin('Facebook')">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                            ĐĂNG KÝ BẰNG FACEBOOK
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script>
        const CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let loginCode = '';
        let regCode = '';

        function drawCode(canvasId, code) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#e8f5e9';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#c8e6c9';
            for (let x = 10; x < canvas.width; x += 15) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            ctx.font = 'bold 22px Arial, sans-serif';
            ctx.textBaseline = 'middle';
            const spacing = (canvas.width - 20) / code.length;
            for (let i = 0; i < code.length; i++) {
                ctx.save();
                ctx.translate(12 + i * spacing, canvas.height / 2);
                ctx.rotate((Math.random() * 20 - 10) * Math.PI / 180);
                ctx.fillStyle = '#1b5e20';
                ctx.fillText(code[i], 0, 0);
                ctx.restore();
            }
        }

        function refreshLoginCaptcha() {
            loginCode = '';
            for (let i = 0; i < 6; i++) loginCode += CHARS.charAt(Math.floor(Math.random() * CHARS.length));
            drawCode('login-captcha-canvas', loginCode);
            document.getElementById('login-captcha-input').value = '';
        }

        function refreshRegCaptcha() {
            regCode = '';
            for (let i = 0; i < 6; i++) regCode += CHARS.charAt(Math.floor(Math.random() * CHARS.length));
            drawCode('reg-captcha-canvas', regCode);
            document.getElementById('reg-captcha-input').value = '';
        }

        function switchTab(tab) {
            const btnLogin = document.getElementById('tab-btn-login');
            const btnReg = document.getElementById('tab-btn-register');
            const pLogin = document.getElementById('panel-login');
            const pReg = document.getElementById('panel-register');

            if (tab === 'register') {
                btnLogin.classList.remove('active');
                btnReg.classList.add('active');
                pLogin.style.display = 'none';
                pReg.style.display = 'block';
                refreshRegCaptcha();
            } else {
                btnReg.classList.remove('active');
                btnLogin.classList.add('active');
                pReg.style.display = 'none';
                pLogin.style.display = 'block';
                refreshLoginCaptcha();
            }
        }

        function socialLogin(provider) {
            const demoUser = {
                id: 99,
                name: `${provider} User`,
                email: `user.${provider.toLowerCase()}@betacinemas.vn`,
                role: 'CUSTOMER',
                points: 50
            };
            localStorage.setItem('currentUser', JSON.stringify(demoUser));
            alert(`Đăng nhập thành công với tài khoản ${provider}!`);
            window.location.href = 'index.html#account';
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash.includes('register')) {
                switchTab('register');
            } else {
                refreshLoginCaptcha();
            }

            document.getElementById('login-captcha-canvas')?.addEventListener('click', refreshLoginCaptcha);
            document.getElementById('reg-captcha-canvas')?.addEventListener('click', refreshRegCaptcha);

            // Xử lý Login
            document.getElementById('standalone-login-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;
                const captcha = document.getElementById('login-captcha-input').value.trim().toUpperCase();
                const errBox = document.getElementById('login-error-msg');
                const btn = document.getElementById('btn-login-submit');

                errBox.style.display = 'none';

                if (captcha !== loginCode.toUpperCase()) {
                    errBox.innerText = 'Mã xác thực captcha không chính xác!';
                    errBox.style.display = 'block';
                    refreshLoginCaptcha();
                    return;
                }

                btn.disabled = true;
                btn.innerText = 'ĐANG ĐĂNG NHẬP...';

                try {
                    let user = null;
                    if (window.API && API.post) {
                        const res = await API.post('/auth/login', { email, password });
                        user = res.user || res;
                    } else {
                        user = { id: 1, name: email.split('@')[0], email, role: 'CUSTOMER', points: 100 };
                    }

                    localStorage.setItem('currentUser', JSON.stringify(user));
                    alert(`Đăng nhập thành công! Xin chào ${user.name || user.email}`);
                    
                    const next = new URLSearchParams(window.location.search).get('next');
                    window.location.href = next || 'index.html#account';

                } catch (err) {
                    errBox.innerText = err.message || 'Email hoặc mật khẩu không chính xác.';
                    errBox.style.display = 'block';
                    refreshLoginCaptcha();
                } finally {
                    btn.disabled = false;
                    btn.innerText = 'ĐĂNG NHẬP';
                }
            });

            // Xử lý Register
            document.getElementById('standalone-register-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('reg-name').value.trim();
                const email = document.getElementById('reg-email').value.trim();
                const phone = document.getElementById('reg-phone').value.trim();
                const password = document.getElementById('reg-password').value;
                const confirmPw = document.getElementById('reg-confirm-pw').value;
                const captcha = document.getElementById('reg-captcha-input').value.trim().toUpperCase();
                const errBox = document.getElementById('reg-error-msg');
                const btn = document.getElementById('btn-reg-submit');

                errBox.style.display = 'none';

                if (password !== confirmPw) {
                    errBox.innerText = 'Mật khẩu xác nhận không trùng khớp!';
                    errBox.style.display = 'block';
                    return;
                }

                if (password.length < 6) {
                    errBox.innerText = 'Mật khẩu phải có ít nhất 6 ký tự!';
                    errBox.style.display = 'block';
                    return;
                }

                if (captcha !== regCode.toUpperCase()) {
                    errBox.innerText = 'Mã xác thực captcha không chính xác!';
                    errBox.style.display = 'block';
                    refreshRegCaptcha();
                    return;
                }

                btn.disabled = true;
                btn.innerText = 'ĐANG ĐĂNG KÝ...';

                try {
                    let user = null;
                    if (window.API && API.post) {
                        const res = await API.post('/auth/register', { name, email, phone, password });
                        user = res.user || res;
                    } else {
                        user = { id: Date.now(), name, email, phone, role: 'CUSTOMER', points: 50 };
                    }

                    localStorage.setItem('currentUser', JSON.stringify(user));
                    alert(`Đăng ký tài khoản thành công! Tặng bạn 50 điểm chào mừng.`);
                    window.location.href = 'index.html#account';

                } catch (err) {
                    errBox.innerText = err.message || 'Không thể tạo tài khoản. Email này có thể đã được đăng ký.';
                    errBox.style.display = 'block';
                    refreshRegCaptcha();
                } finally {
                    btn.disabled = false;
                    btn.innerText = 'ĐĂNG KÝ TÀI KHOẢN';
                }
            });
        });
    </script>
</body>
</html>
