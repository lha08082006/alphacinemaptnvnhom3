<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu Vận Hành - Beta Cinemas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: #1a252f;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .admin-auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 460px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
            border-top: 5px solid #f26b38;
        }
        .auth-header {
            background: #2c3e50;
            color: #ffffff;
            padding: 22px 20px;
            text-align: center;
        }
        .auth-header h1 {
            font-size: 19px;
            letter-spacing: 0.5px;
            font-weight: 700;
            color: #ecf0f1;
        }
        .auth-header p {
            font-size: 13px;
            color: #ffd166;
            margin-top: 6px;
        }
        .auth-body {
            padding: 28px 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-label {
            display: block;
            font-size: 13.5px;
            font-weight: 600;
            color: #333333;
            margin-bottom: 7px;
        }
        .form-control {
            width: 100%;
            padding: 11px 14px;
            font-size: 14.5px;
            border: 1px solid #dce1e7;
            border-radius: 5px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: #03599d;
            box-shadow: 0 0 0 3px rgba(3, 89, 157, 0.15);
        }
        .btn-submit {
            width: 100%;
            padding: 13px;
            font-size: 15px;
            font-weight: 700;
            background: #f26b38;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #d95524;
        }
        .btn-submit:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 12px 15px;
            font-size: 13.5px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            line-height: 1.5;
        }
        .alert-info {
            background: #e8f4fd;
            color: #03599d;
            border: 1px solid #b8daff;
            padding: 12px 15px;
            font-size: 13px;
            border-radius: 5px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="admin-auth-card">
        <div class="auth-header">
            <h1>BETA CINEMAS</h1>
            <p>THAY ĐỔI MẬT KHẨU TÀI KHOẢN NỘI BỘ</p>
        </div>
        <div class="auth-body">
            <div class="alert-info">
                🔒 Vì lý do bảo mật, vui lòng cập nhật mật khẩu mới (tối thiểu 6 ký tự) để tiếp tục truy cập các chức năng vận hành.
            </div>
            
            <div id="password-error" class="alert-error"></div>
            
            <form id="change-password-form">
                <div class="form-group">
                    <label class="form-label" for="oldPassword">Mật khẩu hiện tại</label>
                    <input type="password" id="oldPassword" class="form-control" required placeholder="Nhập mật khẩu hiện tại...">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="newPassword">Mật khẩu mới</label>
                    <input type="password" id="newPassword" class="form-control" required minlength="6" placeholder="Mật khẩu mới (tối thiểu 6 ký tự)...">
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Xác nhận mật khẩu mới</label>
                    <input type="password" id="confirmPassword" class="form-control" required minlength="6" placeholder="Nhập lại mật khẩu mới...">
                </div>
                
                <button type="submit" id="btn-submit" class="btn-submit">LƯU MẬT KHẨU MỚI</button>
            </form>
        </div>
    </div>

    <!-- Scripts Core -->
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Xác thực phiên nhân viên trước
            try {
                const meRes = await API.get('/admin/auth/me');
                if (!meRes || !meRes.user) {
                    window.location.href = 'login.html';
                    return;
                }
            } catch (err) {
                window.location.href = 'login.html';
                return;
            }

            const form = document.getElementById('change-password-form');
            const btnSubmit = document.getElementById('btn-submit');
            const errBox = document.getElementById('password-error');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const oldPassword = document.getElementById('oldPassword').value;
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (!oldPassword || !newPassword || !confirmPassword) {
                    errBox.innerText = "Vui lòng nhập đầy đủ các thông tin.";
                    errBox.style.display = 'block';
                    return;
                }

                if (newPassword.length < 6) {
                    errBox.innerText = "Mật khẩu mới phải có ít nhất 6 ký tự.";
                    errBox.style.display = 'block';
                    return;
                }

                if (newPassword !== confirmPassword) {
                    errBox.innerText = "Xác nhận mật khẩu mới không khớp.";
                    errBox.style.display = 'block';
                    return;
                }

                errBox.style.display = 'none';
                btnSubmit.disabled = true;
                btnSubmit.innerText = "Đang lưu mật khẩu...";

                try {
                    await API.post('/admin/auth/change-password', { oldPassword, newPassword });
                    alert("Đổi mật khẩu thành công! Chuyển tiếp vào bảng điều khiển.");
                    window.location.href = 'index.html';
                } catch (err) {
                    errBox.innerText = err.message || "Đổi mật khẩu thất bại. Vui lòng kiểm tra lại mật khẩu cũ.";
                    errBox.style.display = 'block';
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "LƯU MẬT KHẨU MỚI";
                }
            });
        });
    </script>
</body>
</html>
