<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>CSKH Ticket - Beta Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .ticket-list { max-height: 600px; overflow-y: auto; border-right: 1px solid #eee; padding-right: 20px; }
        .ticket-item { padding: 15px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; cursor: pointer; transition: 0.2s; }
        .ticket-item:hover { background: #f9f9f9; border-color: var(--beta-blue); }
        .ticket-item.active { background: #e3f2fd; border-color: var(--beta-blue); }
        
        .ticket-detail { padding-left: 20px; }
        .detail-box { background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        
        .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; display: none; }
        .col-box { background: white; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        
        .process-steps { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="margin: 0;">QUẢN LÝ KHIẾU NẠI (CSKH)</h3>
    </div>

    <div class="card">
        <div class="card-body" style="display: flex; padding: 20px;">
            <div style="flex: 1;" class="ticket-list" id="ticket-list">
                <!-- Danh sách Ticket -->
            </div>
            
            <div style="flex: 2;" class="ticket-detail" id="ticket-detail">
                <div style="text-align:center; padding:50px; color:#999;">Chọn một ticket để xem chi tiết và xử lý</div>
            </div>
        </div>
    </div>

    <script src="../js/clock.js"></script>
    <script src="../js/db.js"></script>
    <script src="js/admin-layout.js"></script>
    <script src="../js/gateway-core.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let selectedTicket = null;
            
            function renderTickets() {
                const tickets = DB.all('support_tickets') || [];
                const listEl = document.getElementById('ticket-list');
                listEl.innerHTML = '';
                
                // Mới nhất lên trên, chỉ OPEN
                const openTickets = tickets.filter(t => t.status === 'OPEN').sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
                
                if (openTickets.length === 0) {
                    listEl.innerHTML = '<p style="color:#777; text-align:center; margin-top:30px;">Không có khiếu nại nào cần xử lý.</p>';
                    return;
                }
                
                openTickets.forEach(t => {
                    const dStr = new Date(t.createdAt).toLocaleString('vi-VN');
                    let sourceBadge = t.source.includes('USER') ? '<span class="badge info">Khách Khiếu nại</span>' : '<span class="badge warning">Hệ thống Auto</span>';
                    
                    const el = document.createElement('div');
                    el.className = `ticket-item ${selectedTicket && selectedTicket.id === t.id ? 'active' : ''}`;
                    el.innerHTML = `
                        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                            <strong>Đơn: ${t.orderId}</strong>
                            ${sourceBadge}
                        </div>
                        <div style="font-size:13px; color:#555; margin-bottom:8px;">Lý do: ${t.reason}</div>
                        <div style="font-size:11px; color:#999;">Tạo lúc: ${dStr}</div>
                    `;
                    el.onclick = () => {
                        selectedTicket = t;
                        renderTickets();
                        renderDetail();
                    };
                    listEl.appendChild(el);
                });
            }
            
            function renderDetail() {
                const detailEl = document.getElementById('ticket-detail');
                if(!selectedTicket) return;
                
                const t = selectedTicket;
                const order = DB.get('beta_orders', t.orderId);
                const orderHtml = order ? `
                    Mã đơn: <b>${order.orderId}</b> | Tổng tiền: <b>${order.amount.toLocaleString()} đ</b><br>
                    Trạng thái hiện tại: <span class="badge gray">${order.status}</span><br>
                    Ngày tạo: ${new Date(order.createdAt).toLocaleString('vi-VN')}
                ` : `Không tồn tại trong Beta`;

                // Chế độ xử lý phụ thuộc vào nguồn tạo Ticket
                if (t.source === 'USER_ASIS') {
                    detailEl.innerHTML = `
                        <div class="detail-box">
                            <h4 style="margin-top:0; color:var(--beta-blue);">THÔNG TIN TICKET (QUY TRÌNH THỦ CÔNG AS-IS)</h4>
                            <p><b>Liên hệ:</b> ${t.contact}</p>
                            <p>${orderHtml}</p>
                        </div>
                        
                        <div class="compare-grid" id="compare-grid">
                            <div class="col-box" id="beta-data"></div>
                            <div class="col-box" id="gw-data"></div>
                        </div>
                        
                        <div class="process-steps">
                            <button class="btn btn-outline" id="btn-1" onclick="step1()">1. Gọi cổng thanh toán / Check DB chéo (Tra soát)</button>
                            <button class="btn btn-outline" id="btn-2" disabled onclick="step2()">2. Xác nhận giao dịch bị kẹt lỗi</button>
                            <button class="btn btn-primary" id="btn-3" disabled onclick="step3()">3. Gửi lệnh Hoàn tiền Kế toán</button>
                        </div>
                    `;
                } else {
                    // TO-BE Hệ thống tạo hoặc user tạo nhưng đã có tools hỗ trợ
                    let checkStr = '';
                    if (t.checks) {
                        checkStr = `<br><b>Lịch sử Check tự động:</b> 
                            a:${t.checks.a}, b:${t.checks.b}, c:${t.checks.c}, d:${t.checks.d}, e:${t.checks.e}`;
                    }
                    detailEl.innerHTML = `
                        <div class="detail-box">
                            <h4 style="margin-top:0; color:var(--beta-blue);">THÔNG TIN TICKET (XỬ LÝ THÔNG MINH TO-BE)</h4>
                            <p><b>Khách liên hệ:</b> ${t.contact || 'N/A'}</p>
                            <p>${orderHtml}</p>
                            ${checkStr}
                        </div>
                        <div class="process-steps" style="flex-direction: row;">
                            <button class="btn btn-primary" onclick="approveTobe()">Duyệt Hoàn Tiền Ngay</button>
                            <button class="btn btn-outline" onclick="rejectTobe()">Từ Chối (Đóng)</button>
                        </div>
                    `;
                }
            }
            
            // --- QUY TRÌNH AS-IS ---
            window.step1 = function() {
                const grid = document.getElementById('compare-grid');
                grid.style.display = 'grid';
                
                const order = DB.get('beta_orders', selectedTicket.orderId);
                document.getElementById('beta-data').innerHTML = `
                    <h5 style="margin-top:0; color:var(--beta-blue);">HỆ THỐNG BETA</h5>
                    Trạng thái: <b>${order ? order.status : 'N/A'}</b><br>
                    Mã Cổng (TxnId): <b>${order && order.txnId ? order.txnId : 'Rỗng'}</b>
                `;
                
                // Tra cổng
                if(order && order.txnId && window.gatewayCore) {
                    const gw = window.gatewayCore.getTxnStatus(order.txnId);
                    if (gw) {
                        document.getElementById('gw-data').innerHTML = `
                            <h5 style="margin-top:0; color:#00796b;">HỆ THỐNG GATEWAY</h5>
                            Trạng thái: <b style="color:var(--danger);">${gw.status}</b><br>
                            Đã trừ tiền (Debited): <b>${gw.debited}</b>
                        `;
                    }
                } else {
                    document.getElementById('gw-data').innerHTML = `
                        <h5 style="margin-top:0; color:#00796b;">HỆ THỐNG GATEWAY</h5>
                        <p>Không tìm thấy log giao dịch liên kết.</p>
                    `;
                }
                
                alert('MÔ PHỎNG: Nhân viên CSKH phải mở nhiều màn hình đối chiếu thủ công. Trong thực tế, quá trình này mất 1-3 ngày làm việc để xin sao kê ngân hàng.');
                document.getElementById('btn-1').disabled = true;
                document.getElementById('btn-2').disabled = false;
            };
            
            window.step2 = function() {
                alert('Đã xác nhận lệnh bị lệch.');
                document.getElementById('btn-2').disabled = true;
                document.getElementById('btn-3').disabled = false;
            };
            
            window.step3 = function() {
                const order = DB.get('beta_orders', selectedTicket.orderId);
                if(order) {
                    const refundId = DB.generateId.refund();
                    DB.insert('beta_refunds', {
                        refundId, orderId: order.orderId, txnId: order.txnId, amount: order.amount,
                        type: 'MANUAL', status: 'CHECKING', createdAt: VirtualClock.now().toISOString(),
                        slaBreached: false, checks: {}
                    });
                    DB.update('beta_orders', order.orderId, { status: 'REFUND_PENDING', refundId: refundId });
                }
                DB.update('support_tickets', selectedTicket.id, { status: 'CLOSED', resolution: 'Đã tạo lệnh hoàn thủ công (AS-IS)' });
                alert('Hoàn tất quy trình thủ công! Ticket đã đóng.');
                selectedTicket = null;
                renderTickets();
                renderDetail();
            };
            
            // --- QUY TRÌNH TO-BE ---
            window.approveTobe = function() {
                const order = DB.get('beta_orders', selectedTicket.orderId);
                if(order) {
                    const refundId = DB.generateId.refund();
                    DB.insert('beta_refunds', {
                        refundId, orderId: order.orderId, txnId: order.txnId, amount: order.amount,
                        type: 'MANUAL', status: 'CHECKING', createdAt: VirtualClock.now().toISOString(),
                        slaBreached: false, checks: {}
                    });
                    DB.update('beta_orders', order.orderId, { status: 'REFUND_PENDING', refundId: refundId });
                }
                DB.update('support_tickets', selectedTicket.id, { status: 'CLOSED', resolution: 'CSKH duyệt hoàn (TO-BE)' });
                alert('Hoàn tất duyệt! Lệnh hoàn sẽ được bắn đi tự động.');
                selectedTicket = null;
                renderTickets();
                renderDetail();
            };
            
            window.rejectTobe = function() {
                DB.update('support_tickets', selectedTicket.id, { status: 'CLOSED', resolution: 'CSKH Từ chối' });
                selectedTicket = null;
                renderTickets();
                renderDetail();
            };
            
            renderTickets();
        });
    </script>
</body>
</html>
