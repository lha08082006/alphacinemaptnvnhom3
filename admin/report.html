<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Báo cáo Kế toán - Beta Admin</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="margin: 0;">BÁO CÁO ĐỐI SOÁT THEO NGÀY (KẾ TOÁN)</h3>
        <button class="btn btn-success" style="background: #4CAF50; border: none; color: white; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer;" onclick="exportCSV()">TẢI XUỐNG CSV ⬇</button>
    </div>

    <div class="card">
        <div class="card-body" style="padding: 0;">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Ngày</th>
                        <th>Tổng tiền Cổng Ghi Nhận</th>
                        <th>Tổng tiền Beta Thực Thu</th>
                        <th>CHÊNH LỆCH</th>
                        <th>Số GD Treo</th>
                        <th>Số tiền Đã Hoàn</th>
                        <th>Số tiền Đang Xử Lý (Chưa hoàn)</th>
                    </tr>
                </thead>
                <tbody id="report-table"></tbody>
            </table>
        </div>
    </div>

    <script src="../js/clock.js"></script>
    <script src="../js/db.js"></script>
    <script src="js/admin-layout.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.reportData = [];
            
            function renderReport() {
                const orders = DB.all('beta_orders') || [];
                const txns = DB.all('gateway_txns') || [];
                
                // Gom nhóm theo ngày
                const dataByDay = {};
                
                // Quét gateway (Tiền cổng)
                txns.forEach(t => {
                    if (t.status === 'SUCCESS' && t.debited) {
                        const dStr = t.createdAt.split('T')[0];
                        if(!dataByDay[dStr]) dataByDay[dStr] = { gwTotal: 0, betaTotal: 0, treoCount: 0, refundedTotal: 0, pendingRefundTotal: 0 };
                        dataByDay[dStr].gwTotal += t.amount;
                    }
                });
                
                // Quét beta (Tiền beta thực thu & treo & hoàn)
                orders.forEach(o => {
                    const dStr = o.createdAt.split('T')[0];
                    if(!dataByDay[dStr]) dataByDay[dStr] = { gwTotal: 0, betaTotal: 0, treoCount: 0, refundedTotal: 0, pendingRefundTotal: 0 };
                    
                    if (o.status === 'PAID') {
                        dataByDay[dStr].betaTotal += o.amount;
                    }
                    else if (['PENDING_VERIFY', 'REFUND_PENDING', 'FAILED', 'EXPIRED'].includes(o.status)) {
                        // Xác nhận là ca treo thực sự nếu cổng đã trừ tiền
                        const gw = txns.find(x => x.txnId === o.txnId);
                        if (gw && gw.status === 'SUCCESS' && gw.debited) {
                            dataByDay[dStr].treoCount++;
                            
                            if (o.status === 'REFUNDED') {
                                dataByDay[dStr].refundedTotal += o.amount;
                            } else {
                                dataByDay[dStr].pendingRefundTotal += o.amount;
                            }
                        }
                    } else if (o.status === 'REFUNDED') {
                         dataByDay[dStr].refundedTotal += o.amount;
                    }
                });
                
                const tbody = document.getElementById('report-table');
                tbody.innerHTML = '';
                
                const days = Object.keys(dataByDay).sort((a,b) => new Date(b) - new Date(a));
                window.reportData = [];
                
                days.forEach(d => {
                    const row = dataByDay[d];
                    const diff = row.gwTotal - row.betaTotal; // Tiền thừa Cổng giữ của Beta
                    
                    window.reportData.push({
                        Date: d, GatewayTotal: row.gwTotal, BetaTotal: row.betaTotal, Difference: diff,
                        HangingTxns: row.treoCount, Refunded: row.refundedTotal, PendingRefund: row.pendingRefundTotal
                    });
                    
                    const diffStyle = diff > 0 ? 'color:var(--danger); font-weight:bold;' : 'color:#4CAF50;';
                    
                    tbody.insertAdjacentHTML('beforeend', `
                        <tr>
                            <td><strong>${d}</strong></td>
                            <td style="color:#00796b;">${row.gwTotal.toLocaleString()} đ</td>
                            <td style="color:var(--beta-blue);">${row.betaTotal.toLocaleString()} đ</td>
                            <td style="${diffStyle}">${diff.toLocaleString()} đ</td>
                            <td>${row.treoCount}</td>
                            <td>${row.refundedTotal.toLocaleString()} đ</td>
                            <td style="color:var(--warning); font-weight:bold;">${row.pendingRefundTotal.toLocaleString()} đ</td>
                        </tr>
                    `);
                });
            }
            
            renderReport();
            
            window.exportCSV = function() {
                if (window.reportData.length === 0) return alert('Không có dữ liệu');
                
                // Header
                let csvContent = "Ngày,Tổng tiền Cổng,Tổng tiền Beta,Chênh Lệch,Số GD Treo,Đã Hoàn,Chưa Hoàn\n";
                window.reportData.forEach(r => {
                    csvContent += `${r.Date},${r.GatewayTotal},${r.BetaTotal},${r.Difference},${r.HangingTxns},${r.Refunded},${r.PendingRefund}\n`;
                });
                
                // Xuất file
                const blob = new Blob(["\uFEFF"+csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `beta_recon_report_${VirtualClock.now().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        });
    </script>
</body>
</html>
