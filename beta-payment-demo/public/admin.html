<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản trị / Đối soát - Beta DEMO</title><link rel="stylesheet" href="/style.css"></head><body>
<header><b>BETA ADMIN - ĐỐI SOÁT <small>(DEMO)</small></b><nav><a href="/" target="_blank">Đặt vé</a></nav></header>
<main style="max-width:1500px">
  <div class="card tools">
    <button class="btn" onclick="recon()">CHẠY ĐỐI SOÁT NGAY</button>
    <label class="switch"><input type="checkbox" id="auto" onchange="toggleAuto(this.checked)"> Đối soát tự động (mỗi 10s)</label>
    <span id="mode" class="badge"></span>
    <span style="flex:1"></span>
    <button class="btn ghost sm" onclick="resetAll()">Reset dữ liệu demo</button>
  </div>
  <div class="cols">
    <div class="card"><h3>1. Đơn hàng (Website Beta)</h3><table><thead><tr><th>Mã đơn</th><th>Ghế</th><th>Tiền</th><th>Trạng thái</th><th></th></tr></thead><tbody id="orders"></tbody></table></div>
    <div class="card"><h3>2. Giao dịch (Cổng thanh toán)</h3><table><thead><tr><th>Mã GD</th><th>Đơn</th><th>Tiền</th><th>Trạng thái</th><th>Webhook</th></tr></thead><tbody id="txns"></tbody></table></div>
    <div class="card"><h3>3. Nhật ký hệ thống</h3><table><thead><tr><th>Giờ</th><th>Nguồn</th><th>Sự kiện</th></tr></thead><tbody id="logs"></tbody></table></div>
  </div>
</main>
<script src="/common.js"></script>
<script>
async function refresh(){
  const d=await api('/api/admin');
  document.getElementById('auto').checked=d.config.autoRecon;
  const m=document.getElementById('mode'); m.textContent=d.config.autoRecon?'TO-BE (có đối soát)':'AS-IS (không đối soát)'; m.style.background=d.config.autoRecon?'#2e7d32':'#c62828';
  document.getElementById('orders').innerHTML=d.orders.map(o=>`<tr><td><b>${o.code}</b>${o.note?`<div class="muted">${o.note}</div>`:''}</td><td>${o.seats.join(', ')}</td><td>${money(o.amount)}</td><td><span class="badge b-${o.status}">${o.status}</span></td>
    <td>${o.status==='NEEDS_REVIEW'?`<button class="btn sm err" onclick="refund('${o.code}')">Hoàn tiền</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Chưa có đơn</td></tr>';
  document.getElementById('txns').innerHTML=d.txns.map(t=>`<tr><td><b>${t.txnId}</b></td><td>${t.orderCode}</td><td>${money(t.amount)}</td><td><span class="badge b-${t.status}">${t.status}</span>${t.debited?'<div class="muted">đã trừ tiền</div>':''}</td><td>${t.webhook}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Chưa có giao dịch</td></tr>';
  document.getElementById('logs').innerHTML=d.logs.map(l=>`<tr><td>${hhmmss(l.t)}</td><td>${l.who}</td><td class="log-${l.level}">${l.msg}</td></tr>`).join('');
}
async function recon(){ await api('/api/admin/reconcile',{body:{}}); refresh(); }
async function toggleAuto(v){ await api('/api/admin/auto',{body:{enabled:v}}); refresh(); }
async function refund(c){ try{ await api('/api/admin/refund/'+c,{body:{}}); }catch(e){ alert(e.message); } refresh(); }
async function resetAll(){ if(confirm('Xóa toàn bộ dữ liệu demo?')){ await api('/api/admin/reset',{body:{}}); refresh(); } }
refresh(); setInterval(refresh,2000);
</script></body></html>
