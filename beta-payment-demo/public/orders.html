<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch sử đơn hàng của tôi - Beta Cinemas</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="header-client">
    <div class="header-container">
      <a href="/" class="logo-brand">
        <span class="logo-badge">β</span>
        <span class="logo-text">Beta Cinemas</span>
        <span class="logo-sub">Demo</span>
      </a>
      <ul class="nav-links">
        <li><a href="/">Phim</a></li>
        <li><a href="/orders" class="active">Đơn của tôi</a></li>
        <li><a href="/notifications">Thông báo</a></li>
        <li><a href="/support" class="nav-support-highlight">🎧 HỖ TRỢ</a></li>
      </ul>
      <div class="nav-user" id="client-nav-user"></div>
    </div>
  </header>

  <main class="main-wrapper">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <div>
        <h1 style="font-size: 24px; color: var(--navy-dark); font-weight: 800;">LỊCH SỬ ĐƠN HÀNG</h1>
        <p style="color: var(--text-muted); font-size: 13.5px; margin-top: 4px;">Danh sách tất cả các đơn đặt vé xem phim của bạn.</p>
      </div>
      <a href="/" class="btn btn-primary">+ Đặt thêm vé mới</a>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table class="data-table" id="orders-table">
          <thead>
            <tr>
              <th>Mã đơn</th>
              <th>Phim & Rạp</th>
              <th>Suất chiếu</th>
              <th>Ghế</th>
              <th>Tổng tiền</th>
              <th>Trạng thái</th>
              <th>Thời gian</th>
              <th style="text-align: right;">Thao tác</th>
            </tr>
          </thead>
          <tbody id="orders-tbody">
            <tr>
              <td colspan="8" style="text-align: center; padding: 30px; color: var(--text-muted);">
                Đang tải danh sách đơn hàng...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/common.js"></script>
  <script>
    async function loadOrders() {
      await initCustomerNav();

      try {
        const res = await api('/api/orders');
        const tbody = document.getElementById('orders-tbody');
        tbody.innerHTML = '';

        if (!res.orders || res.orders.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="8" style="text-align: center; padding: 40px; color: var(--text-muted);">
                Bạn chưa có đơn đặt vé nào. <a href="/" style="color: var(--primary-orange); font-weight: 700;">Đặt vé ngay!</a>
              </td>
            </tr>
          `;
          return;
        }

        res.orders.forEach(order => {
          const tr = document.createElement('tr');

          let actionBtn = '';
          if (order.status === 'PAID') {
            actionBtn = `<a href="/ticket/${order.orderId}" class="btn btn-navy btn-sm">🎟️ Xem vé</a>`;
          } else if (order.status === 'AWAITING_PAYMENT' || order.status === 'PENDING_VERIFY') {
            actionBtn = `<a href="/result?orderId=${order.orderId}" class="btn btn-primary btn-sm">⏳ Kiểm tra</a>`;
          } else {
            actionBtn = `<a href="/support?code=${order.orderId}" class="btn btn-outline btn-sm" style="color:var(--color-danger);border-color:#FCA5A5">⚠️ Báo lỗi thanh toán</a>`;
          }

          tr.innerHTML = `
            <td><b style="color:var(--primary-navy)">${order.orderId}</b></td>
            <td>
              <b>${order.movieTitle}</b>
              <div style="font-size:11.5px;color:var(--text-muted)">${order.cinema} (${order.room})</div>
            </td>
            <td>${order.showtime}</td>
            <td><b style="color:var(--primary-orange)">${(order.seats || []).join(', ')}</b></td>
            <td><b>${formatVND(order.amount)}</b></td>
            <td><span class="status-badge status-${order.status}">${order.status}</span></td>
            <td style="font-size:12px;color:var(--text-muted)">${formatDateTime(order.createdAt)}</td>
            <td style="text-align: right;">${actionBtn}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        document.getElementById('orders-tbody').innerHTML = `
          <tr>
            <td colspan="8" style="text-align: center; padding: 30px; color: var(--color-danger);">
              ${err.message} (<a href="/login?redirect=/orders" style="color:var(--primary-navy)">Đăng nhập lại</a>)
            </td>
          </tr>
        `;
      }
    }

    loadOrders();
  </script>
</body>
</html>
