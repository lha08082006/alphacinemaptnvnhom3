<!DOCTYPE html>
<html lang="vi">
<head>
    
    <meta charset="UTF-8">
    <title>Hộp thư thông báo - Beta Cinemas DEMO</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .msg-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; transition: 0.2s; }
        .msg-item:hover { background: #f9f9f9; }
        .msg-item.unread { font-weight: bold; background: #e3f2fd; }
        .msg-type { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; margin-right: 10px; color: white; }
        .bg-web { background: var(--beta-blue); }
        .bg-email { background: #E91E63; }
        .bg-sms { background: #4CAF50; }
    </style>
</head>
<body>
    <div class="container-fluid" style="margin-top: 30px; min-height: 500px;">
        <h2 style="color: var(--beta-blue); border-left: 4px solid var(--beta-orange); padding-left: 10px; margin-bottom: 20px;">HỘP THƯ (INBOX GIẢ LẬP)</h2>
        <div class="card">
            <div class="card-body" id="inbox-list" style="padding: 0;">
                <!-- Render js -->
            </div>
        </div>
    </div>

    <script src="js/clock.js"></script>
    <script src="js/data.js"></script>
    <script src="js/db.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/demo-panel.js"></script>
    <script src="js/notify.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
            if(!user) { location.href = 'login.html'; return; }
            
            function renderInbox() {
                const notifs = JSON.parse(localStorage.getItem('notifications') || '[]');
                const myNotifs = notifs.filter(n => n.email === user.email).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
                
                const list = document.getElementById('inbox-list');
                list.innerHTML = '';
                
                if (myNotifs.length === 0) {
                    list.innerHTML = '<div style="padding: 30px; text-align: center; color: #777;">Hộp thư trống</div>';
                    return;
                }
                
                myNotifs.forEach(n => {
                    let bg = 'bg-web';
                    if(n.type === 'EMAIL') bg = 'bg-email';
                    if(n.type === 'SMS') bg = 'bg-sms';
                    
                    const timeStr = new Date(n.createdAt).toLocaleString('vi-VN');
                    
                    const el = document.createElement('div');
                    el.className = `msg-item ${n.read ? '' : 'unread'}`;
                    el.innerHTML = `
                        <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                            <div><span class="msg-type ${bg}">${n.type || 'WEB'}</span> <span style="color:#555;">${n.title || ''}</span></div>
                            <div style="font-size: 12px; color: #888;">${timeStr}</div>
                        </div>
                        <div style="font-size: 14px; color: #333; line-height: 1.5;">${n.body || n.message}</div>
                    `;
                    el.onclick = () => {
                        n.read = true;
                        localStorage.setItem('notifications', JSON.stringify(notifs));
                        renderInbox();
                        updateBell();
                    };
                    list.appendChild(el);
                });
            }
            
            renderInbox();
            window.addEventListener('storage', renderInbox);
            setInterval(renderInbox, 3000); // Tự tải lại msg delay
        });
    </script>
</body>
</html>
