<!DOCTYPE html>
<html lang="vi">
<head>
    
    <meta charset="UTF-8">
    <title>Đăng nhập / Đăng ký - Beta Cinemas DEMO</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container { max-width: 450px; margin: 60px auto; }
    </style>
</head>
<body>
    <div class="container auth-container">
        <div class="card">
            <div class="card-header" style="text-align: center; font-size: 22px; color: var(--beta-blue); padding: 20px;">
                BETA CINEMAS DEMO
            </div>
            <div class="card-body">
                <div class="tabs" style="margin-bottom: 25px; display: flex; justify-content: center;">
                    <div class="tab-item active" style="flex:1; text-align:center;">ĐĂNG NHẬP</div>
                    <div class="tab-item" style="flex:1; text-align:center; color:#ccc;" onclick="alert('Demo hiện chỉ hỗ trợ đăng nhập bằng tài khoản mẫu. Tính năng đăng ký nằm ngoài phạm vi!')">ĐĂNG KÝ</div>
                </div>
                
                <form id="login-form">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" value="khachhang@gmail.com" required placeholder="Nhập email...">
                        <div class="invalid-feedback">Vui lòng nhập định dạng email hợp lệ.</div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Mật khẩu</label>
                        <!-- GHI CHÚ QUAN TRỌNG: Ở môi trường thật, Backend sẽ dùng Bcrypt/Argon2 mã hoá mật khẩu. Client không gửi plain-text password hoặc DB không bao giờ lưu plain-text -->
                        <input type="password" id="password" class="form-control" value="123" required placeholder="Nhập mật khẩu...">
                        <div class="invalid-feedback">Vui lòng nhập mật khẩu.</div>
                    </div>
                    
                    <div id="login-error" style="color: var(--danger); font-size: 13px; margin-bottom: 15px; display: none; background:#ffebeb; padding:10px; border-radius:4px;">
                        Sai email hoặc mật khẩu.
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 16px; padding: 12px;">ĐĂNG NHẬP</button>
                </form>
                
                <div style="margin-top: 25px; font-size: 13px; color: #555; text-align: center; padding: 15px; background: #f9f9f9; border-radius: 4px;">
                    <strong style="color: var(--beta-orange);">Tài khoản Demo có sẵn:</strong><br><br>
                    1. Khách Hàng: <b>khachhang@gmail.com</b> / Pass: <b>123</b><br>
                    2. Quản trị viên: <b>admin@betacinemas.vn</b> / Pass: <b>admin</b>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts Core -->
    <script src="js/clock.js"></script>
    <script src="js/data.js"></script>
    <script src="js/db.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/demo-panel.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            DB.seed();
            
            const form = document.getElementById('login-form');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const errBox = document.getElementById('login-error');
                
                if(!email || !password) {
                    errBox.innerText = "Vui lòng nhập đầy đủ email và mật khẩu.";
                    errBox.style.display = 'block';
                    return;
                }
                
                const accounts = DB.all('accounts');
                // GHI CHÚ BẢO MẬT: Trong dự án thật, logic kiểm tra mật khẩu được thực hiện tại Backend (POST /api/auth/login) thông qua thuật toán Hash.
                // Đây chỉ là mô phỏng frontend.
                const user = accounts.find(a => a.email === email && a.password === password);
                
                if(user) {
                    // Lưu trạng thái đăng nhập vào session giả (localStorage)
                    localStorage.setItem('currentUser', JSON.stringify({
                        id: user.id, email: user.email, name: user.name, role: user.role
                    }));
                    
                    // Xử lý luồng chuyển hướng
                    const urlParams = new URLSearchParams(window.location.search);
                    const next = urlParams.get('next');
                    
                    if (user.role === 'ADMIN') {
                        location.href = 'admin/index.html'; // Admin thì luôn về Dashboard
                    } else if (next) {
                        location.href = next; // Về lại trang đặt vé bị gián đoạn
                    } else {
                        location.href = 'index.html'; // Mặc định về trang chủ
                    }
                } else {
                    errBox.innerText = "Sai email hoặc mật khẩu. Vui lòng kiểm tra lại.";
                    errBox.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
