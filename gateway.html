<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán QR - Beta Cinemas</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Be Vietnam Pro', sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
        }
        
        .qr-outer-container {
            max-width: 1200px;
            margin: 30px auto 60px;
            padding: 0 20px;
        }
        
        .qr-page-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 22px;
            color: #222;
            text-transform: uppercase;
            margin: 0 0 25px 0;
            letter-spacing: 0.3px;
            text-align: left;
        }
        
        .qr-center-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .qr-card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            padding: 30px 25px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 440px;
            width: 100%;
            box-sizing: border-box;
        }
        
        .qr-frame {
            margin: 0 auto 15px;
            max-width: 290px;
            width: 100%;
            background: #fff;
            display: flex;
            justify-content: center;
        }
        
        .qr-frame img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        
        .qr-info-list {
            font-size: 13.5px;
            line-height: 1.85;
            color: #333;
            margin-top: 15px;
            text-align: center;
            width: 100%;
        }
        
        .qr-info-list strong {
            color: #111;
        }
        
        .timer-section-outer {
            margin: 25px 0 20px;
            text-align: center;
        }
        
        .timer-label {
            font-size: 14px;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }
        
        .timer-value {
            font-size: 34px;
            font-weight: 800;
            color: #222;
            font-family: 'Montserrat', monospace;
            letter-spacing: 1px;
        }
        
        .btn-cancel-trans {
            background: #e9ecef;
            color: #495057;
            border: none;
            border-radius: 4px;
            padding: 10px 32px;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn-cancel-trans:hover {
            background: #dee2e6;
            color: #212529;
        }
        
        /* Floating Presenter Panel (Ẩn mặc định, có nút bánh răng mở) */
        .presenter-toggle-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #03599d;
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .presenter-widget {
            position: fixed;
            bottom: 75px;
            right: 20px;
            background: #ffffff;
            border: 2px dashed #03599d;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.2);
            width: 320px;
            z-index: 10000;
            font-size: 12px;
            text-align: left;
            display: none;
        }
        
        .presenter-widget h4 {
            margin: 0 0 10px 0;
            color: #03599d;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .scenario-item {
            display: block;
            margin-bottom: 6px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            border: 1px solid #eee;
        }
        
        .scenario-item:hover {
            background: #f0f7ff;
        }
        
        .scenario-item input {
            margin-right: 6px;
        }
        
        .btn-simulate {
            background: #03599d;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            font-size: 13px;
        }
        
        .btn-simulate:hover {
            background: #024174;
        }
        
        /* Loader Overlay */
        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.92);
            z-index: 20000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #e0e0e0;
            border-top-color: #03599d;
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="qr-outer-container">
        <!-- Tiêu đề trang (Ảnh 5) -->
        <h1 class="qr-page-title">THANH TOÁN QR</h1>
        
        <div class="qr-center-area">
            <!-- Thẻ QR Trắng ở giữa (Ảnh 5) -->
            <div class="qr-card">
                <div class="qr-frame">
                    <img id="qr-image" 
                         src="images/vietqr-full.png" 
                         alt="VietQR Beta Cinemas">
                </div>
                
                <!-- Thông tin chuyển khoản (Ảnh 5) -->
                <div class="qr-info-list">
                    <div>Số tiền: <strong id="lbl-amount">50.000 VND</strong></div>
                    <div>Nội dung CK: <span id="lbl-content">Thanh toan hoa don 8967511872660710</span></div>
                    <div>Số TK: <strong id="lbl-account">96520156FB03MURXE1Y</strong></div>
                    <div style="color: #666; font-size: 13px;">Ngân hàng TMCP Đầu tư và Phát triển Việt Nam</div>
                </div>
            </div>
            
            <!-- Đếm ngược 10 phút & Nút Hủy bên ngoài thẻ (Ảnh 5) -->
            <div class="timer-section-outer">
                <div class="timer-label">Thời gian còn lại</div>
                <div class="timer-value hold-timer" id="gw-timer">10:00</div>
            </div>
            
            <button class="btn-cancel-trans" onclick="cancelTransaction()">HỦY GIAO DỊCH</button>
        </div>
    </div>

    <!-- Nút mở bảng mô phỏng kịch bản (Demo) -->
    <button class="presenter-toggle-btn" onclick="togglePresenterPanel()" title="Kịch bản thanh toán (Demo)">⚙️</button>

    <!-- PRESENTER DEMO CONTROLLER -->
    <div class="presenter-widget" id="presenter-panel">
        <h4>
            <span>⚙️ ĐIỀU KHIỂN KỊCH BẢN (DEMO)</span>
            <span style="cursor:pointer; font-size: 16px;" onclick="togglePresenterPanel()">✕</span>
        </h4>
        <div id="presenter-body">
            <label class="scenario-item" style="border-left: 3px solid #4CAF50;">
                <input type="radio" name="scenario" value="S1" checked> <b>S1: Thành công</b> & Callback ngay
            </label>
            <label class="scenario-item" style="border-left: 3px solid #f44336;">
                <input type="radio" name="scenario" value="S2"> <b>S2: Thất bại</b> (Lỗi tài khoản)
            </label>
            <label class="scenario-item" style="border-left: 3px solid #9E9E9E;">
                <input type="radio" name="scenario" value="S3"> <b>S3: Hủy bỏ</b> giao dịch
            </label>
            <label class="scenario-item" style="border-left: 3px solid #ff9800; background: #fff8e1;">
                <input type="radio" name="scenario" value="S4"> <b>S4: GIAO DỊCH TREO</b> (Rớt Callback)
            </label>
            <label class="scenario-item" style="border-left: 3px solid #2196F3;">
                <input type="radio" name="scenario" value="S5"> <b>S5: Chậm trễ</b> (Callback sau 5p)
            </label>
            <button class="btn-simulate" id="btn-submit" onclick="submitGateway()">MÔ PHỎNG QUÉT XONG QR</button>
        </div>
    </div>

    <!-- Loader -->
    <div class="loader-overlay" id="loader">
        <div class="spinner"></div>
        <p style="margin-top: 20px; font-weight: bold; color: #03599d;" id="loader-text">Đang xử lý kết quả thanh toán...</p>
    </div>

    <!-- Scripts -->
    <script src="js/clock.js"></script>
    <script src="js/data.js"></script>
    <script src="js/db.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/notify.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/beta-core.js"></script>
    
    <script>
        window.currentTxn = null;

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            let txnId = urlParams.get('txn');
            let orderId = urlParams.get('orderId') || localStorage.getItem('currentOrder') || '8967511872660710';
            
            // Tìm hoặc tạo txn phù hợp
            let txn = (typeof DB !== 'undefined' && txnId) ? DB.get('gateway_txns', txnId) : null;
            
            if (!txn) {
                // Mock transaction mặc định khớp Ảnh 5 nếu mở trực tiếp
                let order = (typeof DB !== 'undefined') ? DB.get('beta_orders', orderId) : null;
                const amount = (order && order.amount) ? order.amount : 50000;
                
                txnId = txnId || 'GW' + Math.random().toString(36).substring(2, 10).toUpperCase();
                txn = {
                    txnId: txnId,
                    orderId: orderId,
                    method: 'QR',
                    amount: amount,
                    status: 'PENDING',
                    debited: false,
                    callback: null,
                    createdAt: new Date().toISOString()
                };
                if (typeof DB !== 'undefined') {
                    DB.insert('gateway_txns', txn);
                }
            }
            
            window.currentTxn = txn;
            
            // Cập nhật thông tin lên UI
            const formattedAmount = Number(txn.amount || 50000).toLocaleString('vi-VN') + ' VND';
            document.getElementById('lbl-amount').innerText = formattedAmount;
            
            const contentOrder = txn.orderId || '8967511872660710';
            document.getElementById('lbl-content').innerText = 'Thanh toan hoa don ' + contentOrder;
            
            // ========================================================
            // CHỖ THAY ĐỔI ẢNH QR THANH TOÁN:
            // Bạn có thể đổi đường dẫn sang ảnh của bạn (vd: 'images/my-qr.png' hoặc link ảnh online)
            // ========================================================
            const qrImg = document.getElementById('qr-image');
            const customQrImage = 'images/vietqr-full.png'; // <-- Đổi đường dẫn ảnh QR tại đây
            
            if (customQrImage) {
                qrImg.src = customQrImage;
            } else {
                // Tự động tạo ảnh VietQR live theo số tiền
                const cleanAddInfo = encodeURIComponent('Thanh toan hoa don ' + contentOrder);
                qrImg.src = `https://img.vietqr.io/image/bidv-96520156FB03MURXE1Y-compact2.png?amount=${txn.amount}&addInfo=${cleanAddInfo}&accountName=BETA%20CINEMAS`;
                qrImg.onerror = function() {
                    this.src = 'images/vietqr-full.png';
                };
            }
        });

        function togglePresenterPanel() {
            const panel = document.getElementById('presenter-panel');
            panel.style.display = (panel.style.display === 'none' || panel.style.display === '') ? 'block' : 'none';
        }

        function cancelTransaction() {
            if (confirm('Bạn có chắc chắn muốn hủy giao dịch thanh toán này?')) {
                if (window.currentTxn && typeof DB !== 'undefined') {
                    window.currentTxn.status = 'CANCELLED';
                    DB.update('gateway_txns', window.currentTxn.txnId, window.currentTxn);
                }
                location.href = 'checkout.html';
            }
        }

        function submitGateway() {
            if (!currentTxn) return;
            
            const btn = document.getElementById('btn-submit');
            if (btn) btn.disabled = true;
            
            const loader = document.getElementById('loader');
            loader.style.display = 'flex';
            
            const scenario = document.querySelector('input[name="scenario"]:checked').value;
            let finalStatus = 'PENDING';
            let isDebited = false;
            let webhookMode = 'OK';
            
            switch(scenario) {
                case 'S1':
                    finalStatus = 'SUCCESS';
                    isDebited = true;
                    webhookMode = 'OK';
                    break;
                case 'S2':
                    finalStatus = 'FAILED';
                    isDebited = false;
                    webhookMode = 'OK';
                    break;
                case 'S3':
                    finalStatus = 'CANCELLED';
                    isDebited = false;
                    webhookMode = 'OK';
                    break;
                case 'S4':
                    finalStatus = 'SUCCESS';
                    isDebited = true;
                    webhookMode = 'LOST';
                    break;
                case 'S5':
                    finalStatus = 'SUCCESS';
                    isDebited = true;
                    webhookMode = 'DELAYED';
                    break;
            }
            
            setTimeout(() => {
                currentTxn.status = finalStatus;
                currentTxn.debited = isDebited;
                
                if (webhookMode === 'DELAYED') {
                    currentTxn.callback = {
                        mode: 'DELAYED',
                        delayedUntil: ((typeof VirtualClock !== 'undefined') ? VirtualClock.now().getTime() : Date.now()) + 5 * 60000 
                    };
                } else if (webhookMode === 'LOST') {
                    currentTxn.callback = { mode: 'LOST' };
                } else {
                    currentTxn.callback = { mode: 'DONE' };
                }
                
                if (typeof DB !== 'undefined') {
                    DB.update('gateway_txns', currentTxn.txnId, currentTxn);
                }
                
                if (webhookMode === 'OK' && window.betaCore) {
                    window.betaCore.receiveCallback({
                        txnId: currentTxn.txnId,
                        orderId: currentTxn.orderId,
                        amount: currentTxn.amount,
                        status: finalStatus
                    });
                }
                
                document.getElementById('loader-text').innerText = 'Đang đưa bạn trở về Beta Cinemas...';
                
                setTimeout(() => {
                    location.href = `result.html?orderId=${currentTxn.orderId}`;
                }, 1000);
            }, 1200);
        }
    </script>
</body>
</html>
